name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-patches:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install static checker
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck build-essential

      - name: Public-release audit
        env:
          G2_PRIVATE_PATTERNS: ${{ secrets.G2_PRIVATE_PATTERNS }}
        run: |
          if [ -n "$G2_PRIVATE_PATTERNS" ]; then
            printf '%s\n' "$G2_PRIVATE_PATTERNS" > scripts/.private-patterns
          fi
          ./scripts/check-publishable.py

      - name: ShellCheck maintained entry points
        run: |
          shellcheck \
            scripts/setup-index-controllers.sh \
            scripts/beat-saber-index.sh \
            scripts/g2-preflight.sh \
            scripts/g2-control-panel.sh \
            scripts/vr-overlay-action.sh \
            scripts/install-control-panel.sh \
            scripts/nvidia-g2-patch-manager.sh \
            scripts/sync-nvidia-initramfs.sh \
            scripts/vrserver-memory-guard.sh

      - name: Verify Monado patch series against pinned source
        run: |
          git clone https://github.com/AshishKumar4/monado-wmr.git /tmp/monado-wmr
          git -C /tmp/monado-wmr checkout --detach 9893ba4cb0dabe45e2383c2270fa0f3d4ed79ab2
          source scripts/setup-index-controllers.sh
          apply_verified_series Monado /tmp/monado-wmr "$GITHUB_WORKSPACE/patches/monado-wmr"
          apply_verified_series Monado /tmp/monado-wmr "$GITHUB_WORKSPACE/patches/monado-wmr"

      - name: Compile repository C and C++ utilities
        run: |
          mkdir -p /tmp/reverb-g2-compile
          for source in scripts/openvr-*.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only \
              -I/tmp/monado-wmr/src/external/openvr_includes "$source"
          done

      - name: Verify Basalt patch series against pinned source
        run: |
          git clone https://gitlab.freedesktop.org/mateosss/basalt.git /tmp/basalt
          git -C /tmp/basalt checkout --detach df6e970c8da7636eb401a09e3317fbeaaf829b9a
          source scripts/setup-index-controllers.sh
          apply_verified_series Basalt /tmp/basalt "$GITHUB_WORKSPACE/patches/basalt-wmr"
          apply_verified_series Basalt /tmp/basalt "$GITHUB_WORKSPACE/patches/basalt-wmr"

      - name: Verify Space Calibrator patch series against pinned source
        run: |
          git clone https://github.com/xi-ve/openvr-space-calibrator-linux.git /tmp/space-calibrator
          git -C /tmp/space-calibrator checkout --detach 28e3f83f7bc9808f145fac03ff8a8e455ab211fe
          source scripts/setup-index-controllers.sh
          apply_verified_series 'OpenVR Space Calibrator' /tmp/space-calibrator \
            "$GITHUB_WORKSPACE/patches/space-calibrator"
          apply_verified_series 'OpenVR Space Calibrator' /tmp/space-calibrator \
            "$GITHUB_WORKSPACE/patches/space-calibrator"

      - name: Verify NVIDIA patch series against tested releases
        run: |
          while read -r version commit pattern; do
            target="/tmp/nvidia-$version"
            git clone --quiet --filter=blob:none --depth 1 --branch "$version" \
              https://github.com/NVIDIA/open-gpu-kernel-modules.git "$target"
            test "$(git -C "$target" rev-parse HEAD)" = "$commit"
            while IFS= read -r patch; do
              git -C "$target" apply --check "$GITHUB_WORKSPACE/$patch"
              git -C "$target" apply "$GITHUB_WORKSPACE/$patch"
            done < <(find patches/nvidia -maxdepth 1 -name "$pattern" -print | sort)
          done <<'EOF'
          595.71.05 51edebee79919b54f498c19a0be31982cd97646e 000[1-5]-*.patch
          610.57.04 e4a5faa2567f28c8eabe0ebb6422b6d0abcf37eb 000[3-5]-*.patch
          EOF
